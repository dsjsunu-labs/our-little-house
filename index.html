  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function startOfDay(ts) {
    const d = new Date(ts || Date.now());
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  function dayKey(ts) {
    const d = new Date(ts || Date.now());
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function parseDate(str) {
    if (!str) return null;
    const m = String(str).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }

  function fmtDate(ts) {
    const d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function fmtDateLong(ts) {
    const d = new Date(ts);
    const week = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 · 周' + week;
  }

  function fmtTime(ts) {
    const d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function fmtDateTime(ts) {
    return fmtDate(ts) + ' ' + fmtTime(ts);
  }

  function relTime(ts) {
    const diff = Date.now() - ts;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < DAY) return Math.floor(diff / 3600000) + ' 小时前';
    if (diff < DAY * 7) return Math.floor(diff / DAY) + ' 天前';
    return fmtDate(ts);
  }

  function groupLabel(ts) {
    const today = startOfDay(Date.now());
    const target = startOfDay(ts);
    if (target === today) return '今天';
    if (target === today - DAY) return '昨天';
    if (target === today - DAY * 2) return '前天';
    return fmtDate(ts);
  }

  function getDayInfo() {
    const start = parseDate(state && state.meta && state.meta.start);
    if (!start) {
      return { count: 1, label: '从今天开始', nextDays: null, nextLabel: '把今天写成第一天', startYear: new Date().getFullYear(), isToday: false };
    }
    const startMs = startOfDay(start.getTime());
    const today = startOfDay(Date.now());
    const count = Math.max(1, Math.floor((today - startMs) / DAY) + 1);
    const next = new Date(today);
    next.setMonth(start.getMonth(), start.getDate());
    next.setHours(0, 0, 0, 0);
    if (next.getTime() < today) next.setFullYear(next.getFullYear() + 1);
    const nextDays = Math.round((next.getTime() - today) / DAY);
    let nextLabel;
    if (nextDays === 0) nextLabel = '今天是纪念日';
    else if (nextDays === 1) nextLabel = '明天是我们的纪念日';
    else nextLabel = '距离纪念日还有 ' + nextDays + ' 天';
    return { count: count, label: '第 ' + count + ' 天', nextDays: nextDays, nextLabel: nextLabel, startYear: start.getFullYear(), isToday: nextDays === 0 };
  }

  function quoteOfDay(offset) {
    return QUOTES[(hashString(dayKey() + 'quote') + (offset || 0)) % QUOTES.length];

  function atmosphere() {

  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < String(str).length; i++) {
      h ^= String(str).charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return Math.abs(h >>> 0);
  }

  function pick(list, seed, offset) {
    if (!list || !list.length) return '';
    const n = Math.abs((Number(seed) || 0) + (offset || 0));
    return list[n % list.length];

  function seeded(seed) {
    let t = Math.abs(Number(seed) || 1) % 2147483647;
    if (t <= 0) t += 2147483646;
    return function () {

      return (t - 1) / 2147483646;
    };
  }

  function normalizeUrl(raw) {
    let s = String(raw || '').trim();
    if (!s) return '';
    const m = s.match(/https?:\/\/[^\s<>"']+/i);
    if (m) s = m[0];
    else if (/^(www\.|m\.|v\.|b23\.tv)/i.test(s)) s = 'https://' + s;
    else if (!/^[a-z][a-z0-9+.-]*:/i.test(s) && /^[\w-]+(\.[\w-]+)+/.test(s)) s = 'https://' + s;
    s = s.replace(/[，。！？；、]+$/g, '').replace(/[)\]}>]+$/g, '');
    try {
      const u = new URL(s);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
      return u.href;
    } catch (e) {
      return '';
    }
  }

  /* =========================================================
     SHA-256 (local door lock only)
     ========================================================= */
  function sha256(input) {
    const K = [
      0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
      0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
      0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
      0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
      0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
      0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
      0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
      0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
    ];
    const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const bytes = new TextEncoder().encode(String(input));
    const bitLen = bytes.length * 8;
    const paddedLen = (((bytes.length + 8) >> 6) + 1) * 64;
    const padded = new Uint8Array(paddedLen);
    padded.set(bytes);
    padded[bytes.length] = 0x80;
    const view = new DataView(padded.buffer);
    view.setUint32(paddedLen - 8, Math.floor(bitLen / 0x100000000), false);
    view.setUint32(paddedLen - 4, bitLen >>> 0, false);
    const rotr = function (x, n) { return (x >>> n) | (x << (32 - n)); };
    const w = new Uint32Array(64);
    for (let offset = 0; offset < paddedLen; offset += 64) {
      for (let i = 0; i < 16; i++) w[i] = view.getUint32(offset + i * 4, false);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    return H.map(function (n) { return n.toString(16).padStart(8, '0'); }).join('');
  }

  function makeSalt() {
    try {
      const arr = new Uint8Array(12);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    } catch (e) {
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }
  }

  function hashPassword(password, salt) {
    /* 口令哈希沿用最初的命名空间，换掉会让已经设置过的小屋打不开。 */
    return sha256('kitty-house::' + salt + '::' + password);
  }

  function verifyPassword(password) {
    if (!state || !state.meta || !state.meta.password) return false;
    return hashPassword(password, state.meta.password.salt) === state.meta.password.hash;
  }

  function ensureState(data) {
    data.statuses = Array.isArray(data.statuses) ? data.statuses : [];

    data.statuses.forEach(function (p) {
      p.reactions = p.reactions || {};
      p.comments = Array.isArray(p.comments) ? p.comments : [];
      p.images = Array.isArray(p.images) ? p.images.filter(Boolean) : [];

      p.mood = p.mood || '';
      p.activity = p.activity || '';
      p.place = p.place || '';

    data.foods.forEach(function (f) { f.tags = Array.isArray(f.tags) ? f.tags : []; f.done = !!f.done; f.rating = Number(f.rating) || 0; });
    data.travels.forEach(function (t) { t.done = !!t.done; });
    data.dramas.forEach(function (d) {
      d.total = Number(d.total) || 0;
      if (d.status === 'watching') d.status = 'want';
      d.status = d.status === 'done' ? 'done' : 'want';
      delete d.watched;
    });
    data.memories.forEach(function (m) { m.url = m.url || ''; m.image = m.image || ''; });
    data.events.forEach(function (e) {
      e.date = e.date || dayKey();
      e.type = e.type || 'date';
      e.title = e.title || '一个小约定';
    });
    data.todos.forEach(function (t) {
      t.category = t.category || '生活';
      t.done = !!t.done;
    });
    data.visits.forEach(function (v) {
      v.city = v.city || '';
      v.date = v.date || dayKey();
    });
    data.countdowns.forEach(function (c) {
      c.date = c.date || dayKey();
      c.time = c.time || '00:00';
      c.repeat = c.repeat === 'once' ? 'once' : 'yearly';
      c.emoji = c.emoji || '💗';
      c.title = c.title || '一个重要的日子';
      c.note = c.note || '';
      c.author = c.author === 'b' ? 'b' : 'a';
    });
    if (!data.meta.countdownSeeded) {
      data.countdowns = defaultCountdowns(data);
      data.meta.countdownSeeded = true;
    }
    return data;
  }

  /* =========================================================

     ========================================================= */
  function navPage() {
    if (['zodiac', 'dramas', 'memories', 'settings', 'recap', 'calendar', 'footprints', 'checklist', 'countdown'].indexOf(session.page) >= 0) return 'us';
    return session.page;
  }

  function enterApp() {
    state = ensureState(state);
    session.unlocked = true;
    session.activeUser = state.meta.activeUser === 'b' ? 'b' : 'a';
    session.page = 'home';
    session.feedFilter = 'all';
    session.openComments = new Set();
    session.stickerFor = null;
    session.showAllFeed = false;
    renderShell();
    window.scrollTo(0, 0);
  }

  function renderShell() {
    document.body.classList.remove('modal-open');
    $app.className = '';
    $app.innerHTML = '<div id="topbar"></div><main id="page" class="page"></main><nav id="bottom-nav"></nav>';
    renderTopbar();
    renderPage(false);
    renderNav();
  }

  function renderTopbar() {
    const host = document.getElementById('topbar');
    if (!host) return;
    const u = currentUser();
    host.innerHTML = '<header class="topbar">' +
      '<div class="brand"><span class="brand-mark">' + avatarSvg('mochi') + '</span>' +
      '<span class="brand-word"><b>OUR LITTLE HOUSE</b><small>PRIVATE FOR TWO</small></span></div>' +
      '<div class="top-actions">' +
      '<button class="identity" data-action="switch-user" aria-label="切换当前身份">' +
      avatarHtml(u, 'xs') + '<b>' + esc(u.name) + '</b>' + icon('chevronDown', 11) +
      '</button>' +
      '<button class="lock-btn" data-action="lock" aria-label="锁上小屋">' + icon('lock', 16) + '</button>' +
      '</div></header>';
  }

  function renderNav() {
    const host = document.getElementById('bottom-nav');
    if (!host) return;
    const active = navPage();
    const items = [
      { page: 'home', label: '小屋', icon: 'home' },
      { page: 'report', label: '报备', icon: 'report' },
      { page: 'food', label: '美食', icon: 'food' },
      { page: 'travel', label: '旅行', icon: 'travel' },
      { page: 'us', label: '我们', icon: 'us' }
    ];
    host.className = 'bottom-nav';
    host.innerHTML = items.map(function (it) {
      const on = active === it.page;
      return '<button class="nav-item' + (on ? ' active' : '') + '" data-action="nav" data-page="' + it.page + '"' + (on ? ' aria-current="page"' : '') + '>' +
        '<span class="nav-icon">' + icon(it.icon, 21) + '</span><span>' + it.label + '</span></button>';
    }).join('');
  }

  function navigate(page) {
    if (!page) return;
    closeSheet(true);
    session.page = page;
    session.stickerFor = null;
    renderTopbar();
    renderNav();
    renderPage(false);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function refreshPage(preserveScroll) {
    const y = window.scrollY;
    renderPage(!!preserveScroll);
    if (preserveScroll) window.scrollTo(0, y);
  }

  function renderPage() {
    const host = document.getElementById('page');
    if (!host) return;
    const pages = {
      home: renderHome,
      report: renderReportPage,
      food: renderFoodPage,
      travel: renderTravelPage,
      us: renderUsPage,
      zodiac: renderZodiacPage,
      dramas: renderDramaPage,
      memories: renderMemoryPage,
      settings: renderSettingsPage,
      recap: renderRecapPage,
      calendar: renderCalendarPage,
      footprints: renderFootprintsPage,
      checklist: renderChecklistPage,
      countdown: renderCountdownPage
    };
    const fn = pages[session.page] || renderHome;
    host.innerHTML = '<div class="page-inner">' + fn() + '</div>';
    host.classList.remove('page-anim');
    void host.offsetWidth;
    host.classList.add('page-anim');
  }

    return '<div class="subhead">' +

  /* =========================================================
     Report page
     ========================================================= */
  function renderReportPage() {
    const all = (state.reports || []).slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
    const filtered = session.reportFilter === 'all' ? all : all.filter(function (r) { return r.author === session.reportFilter; });
    const groups = [];
    filtered.forEach(function (r) {
      const key = dayKey(r.createdAt);
      let g = groups.find(function (x) { return x.key === key; });
      if (!g) { g = { key: key, ts: r.createdAt, items: [] }; groups.push(g); }
      g.items.push(r);
    });
    const week = [];
    const today = startOfDay(Date.now());
    for (let i = 6; i >= 0; i--) week.push(today - i * DAY);
    const weekCount = all.filter(function (r) { return r.createdAt >= today - 6 * DAY; }).length;
    const streak = reportStreak();
    const a = user('a'), b = user('b');
    return '<div class="report-hero"><h1>不是查岗，<br><em>是想让你安心。</em></h1>' +
      '<p>“我到家啦”“吃饭啦”“准备睡啦”……这些小小的回声，是两个人之间最踏实的连线。</p>' +
      '<span class="stamp">SEEN<br><b>WITH LOVE</b></span></div>' +
      '<div class="report-quick">' + REPORT_TYPES.map(function (r) {
        return '<button class="quick-report" data-action="quick-report" data-type="' + r.type + '"><span class="qr-emoji">' + r.emoji + '</span><span>' + r.type + '</span><span class="qr-sub">' + r.sub + '</span></button>';
      }).join('') + '</div>' +
      '<div class="report-stats">' +
      '<div class="report-stat"><b>' + all.length + '</b><span>累计报备</span></div>' +
      '<div class="report-stat"><b>' + weekCount + '</b><span>本周报备</span></div>' +
      '<div class="report-stat"><b>' + streak + '</b><span>连续天数</span></div>' +
      '</div>' +
      '<div class="week-strip">' + week.map(function (ts) {
        const count = all.filter(function (r) { return dayKey(r.createdAt) === dayKey(ts); }).length;
        const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
        const isToday = dayKey(ts) === dayKey();
        return '<div class="week-day' + (count ? ' has' : '') + (isToday ? ' today' : '') + '"><b>' + dayNames[new Date(ts).getDay()] + '</b><span class="w-dot">' + (count || new Date(ts).getDate()) + '</span><span>' + (new Date(ts).getMonth() + 1) + '/' + new Date(ts).getDate() + '</span></div>';
      }).join('') + '</div>' +
      '<div class="report-tools"><div class="chip-row">' +
      reportFilterChip('all', '全部') + reportFilterChip('a', a.name) + reportFilterChip('b', b.name) +
      '</div><button class="btn btn-secondary btn-sm" data-action="open-report">' + icon('plus', 11) + ' 自定义</button></div>' +
      (groups.length ? '<div class="report-timeline">' + groups.map(function (g) {
        return '<div class="report-day"><h3>' + groupLabel(g.ts) + ' <span>' + fmtDate(g.ts) + ' · ' + g.items.length + ' 次</span></h3>' +
          g.items.map(renderReportItem).join('') + '</div>';
      }).join('') + '</div>' : '<div class="empty"><span class="emoji">📮</span><h3>这里的回声还很安静</h3><p>点上面的任意一个按钮，发出今天的第一条报备。</p></div>') +
      '<div class="report-note">报备不是义务，是“我想起你了”的另一种说法。<br>连续报备 ' + streak + ' 天，已经是很了不起的默契。</div>';
  }

  function reportFilterChip(id, label) {
    return '<button class="chip' + (session.reportFilter === id ? ' active' : '') + '" data-action="report-filter" data-filter="' + id + '">' + esc(label) + '</button>';
  }

  function renderReportItem(r) {
    const u = user(r.author);
    const canDelete = r.author === session.activeUser;
    return '<div class="report-item"><span class="r-icon">' + esc(r.emoji || '💌') + '</span><div class="r-main"><b>' + esc(r.type) + ' · ' + esc(u.name) + '</b>' +

  }

  function reportStreak() {
    const keys = new Set((state.reports || []).map(function (r) { return dayKey(r.createdAt); }));
    let cursor = startOfDay(Date.now());
    if (!keys.has(dayKey(cursor))) cursor -= DAY;
    let n = 0;
    while (keys.has(dayKey(cursor))) { n++; cursor -= DAY; if (n > 999) break; }
    return n;
  }

  /* =========================================================

     ========================================================= */

  function zodiacForUser(id) {
    return id === 'a' ? ZODIACS[11] : ZODIACS[8];
  }

  function zodiacLabel(id) {
    const z = zodiacForUser(id);
    return z.name.replace('座', '') + (id === 'a' ? '女' : '男');
  }

  function zodiacOf(birthday) {
    const d = parseDate(birthday);
    if (!d) return null;
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const md = m * 100 + day;
    if (md >= 321 && md <= 419) return ZODIACS[0];
    if (md >= 420 && md <= 520) return ZODIACS[1];
    if (md >= 521 && md <= 621) return ZODIACS[2];
    if (md >= 622 && md <= 722) return ZODIACS[3];
    if (md >= 723 && md <= 822) return ZODIACS[4];
    if (md >= 823 && md <= 922) return ZODIACS[5];
    if (md >= 923 && md <= 1023) return ZODIACS[6];
    if (md >= 1024 && md <= 1122) return ZODIACS[7];
    if (md >= 1123 && md <= 1221) return ZODIACS[8];
    if (md >= 1222 || md <= 119) return ZODIACS[9];
    if (md >= 120 && md <= 218) return ZODIACS[10];
    return ZODIACS[11];
  }

  function compatibilityScore(a, b) {
    const za = zodiacForUser(a.id);
    const zb = zodiacForUser(b.id);
    if (!za || !zb) return 0;
    const key = za.element + '-' + zb.element;
    const base = ELEMENT_PAIR[key] || 72;
    const jitter = (hashString(a.name + b.name + za.id + zb.id) % 7) - 3;
    return Math.max(55, Math.min(98, base + jitter));
  }

  function dailyFortune(a, b) {
    const za = zodiacForUser(a.id);
    const zb = zodiacForUser(b.id);
    if (!za || !zb) return null;
    const seed = hashString(dayKey() + za.id + zb.id + a.name + b.name);
    return {
      good: pick(GOOD_FORTUNES, seed, 3),
      bad: pick(BAD_FORTUNES, seed, 9),
      cautions: [
        pick(CAUTIONS, seed, 4),
        pick(CAUTIONS, seed, 11),
        pick(CAUTIONS, seed, 17)
      ],
      lucky: pick(['奶油白', '草莓粉', '薄荷绿', '黄油黄', '雾霾蓝', '葡萄紫'], seed, 23),

  }

      'earth-fire': '一个想马上行动，一个想先想清楚。节奏不同不代表不合适，提前说好“谁先迈一步”，会少很多误会。',

      'water-fire': '一个像火，一个像水，靠近时很迷人，也容易互相蒸发。火需要被温柔回应，水需要被明确安放。',
      'earth-air': '一个脚踏实地，一个想要呼吸。你们可以互相打开新的世界，也要记得把“我在”说给那个容易想多的人听。',

    const frictionMap = {

      earth: '习惯把不舒服攒着，别等“扣分”扣完了才开口，小事也值得当天说清楚。',
      air: '容易用玩笑带过认真，遇到重要的事，试着把“没事”换成“其实我有一点在意”。',

    const descA = pick(ta.desc, seed, 1);
    let descB = pick(tb.desc, seed, 4);

    const quirkA = pick(ta.quirk, seed, 2);

    const mbtiB = String(b.mbti || '').toUpperCase();
    let mbtiLine = '';
    if (mbtiA && mbtiB) {
      const both = function (ch) { return mbtiA.indexOf(ch) >= 0 && mbtiB.indexOf(ch) >= 0; };

      if (both('N')) note = '两个 N 人相处，最不缺的就是脑内小剧场和深夜长谈。记得偶尔把想法落到具体的行动上。';

      else if (either('T') && either('F')) note = '一个先讲逻辑，一个先讲感受，先确认彼此不是在对立，再讨论问题。';
      else if (both('J')) note = '两个 J 人喜欢计划，偶尔来一次没有安排的散步会很有趣。';
      else if (both('P')) note = '两个 P 人自由随性，记得给重要的事设一个小提醒。';
      else if (either('J') && either('P')) note = '一个爱计划，一个爱随性，提前约定哪些事必须定、哪些事可以随缘。';
      else note = '这张字母表只是一个切口，不是你们的说明书。';
      mbtiLine = '你们的 MBTI 是 ' + mbtiA + ' × ' + mbtiB + '。' + note;
    } else if (mbtiA || mbtiB) {
      mbtiLine = '目前只记录了' + (mbtiA ? a.name : b.name) + '的 MBTI（' + (mbtiA || mbtiB) + '），补上另一个人的，会更好玩。';

    const dataLine = '你们已经一起留下 ' + statusCount + ' 条动态、' + reportCount + ' 次报备、' + foodCount + ' 个美食心愿和 ' + travelCount + ' 个旅行坐标。' +

    const report = {
      seed: seed,
      createdAt: Date.now(),
      titleA: titleA,
      titleB: titleB,
      tagsA: ta.tags.slice(0, 3),
      tagsB: tb.tags.slice(0, 3),
      summary: summary,
      mbtiLine: mbtiLine,
      aParagraph: aParagraph,
      bParagraph: bParagraph,
      chemistry: chemistryMap[combo] || '你们的相处有自己的节奏，不必照搬别人的恋爱模板。',

        ? '你们都' + frictionMap[za.element]

      task: task,
      dataLine: dataLine,
      score: score
    };
    state.meta.ai = report;
    saveState();
  }

  function renderDramaPage() {

    let y = Number(parts[0]);
    let m = Number(parts[1]);
    if (!y || !m) { const n = new Date(); y = n.getFullYear(); m = n.getMonth() + 1; }
    const d = new Date(y, m - 1 + delta, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }

  function monthTitle(key) {
    const parts = String(key || '').split('-');
    return Number(parts[0]) + ' 年 ' + Number(parts[1]) + ' 月';
  }

  function monthLabel(key) {
    const parts = String(key || '').split('-');
    return Number(parts[0]) + '.' + pad(Number(parts[1]));
  }

  function inMonth(ts, key) {
    return dayKey(ts).slice(0, 7) === key;
  }

  function anniversaryForMonth(key) {
    const start = parseDate(state.meta.start);
    if (!start) return null;
    const parts = String(key).split('-');
    const y = Number(parts[0]);
    const m = Number(parts[1]);
    if (start.getMonth() + 1 !== m) return null;
    const d = new Date(y, m - 1, start.getDate());
    if (d.getMonth() + 1 !== m) return null;
    return {
      id: 'anniversary-' + y,
      title: '在一起纪念日',
      date: dayKey(d),
      type: 'anniversary',
      note: '第 ' + (y - start.getFullYear() + 1) + ' 年，还是想和你一起过。',
      derived: true
    };
  }

  function calendarEventsForMonth(key) {
    const list = (state.events || []).filter(function (e) { return String(e.date).slice(0, 7) === key; });
    const ann = anniversaryForMonth(key);
    if (ann) list.push(ann);
    return list.sort(function (a, b) { return a.date.localeCompare(b.date); });
  }

  function recapStats(key) {
    const statuses = (state.statuses || []).filter(function (p) { return inMonth(p.createdAt, key); }).sort(function (a, b) { return b.createdAt - a.createdAt; });
    const reports = (state.reports || []).filter(function (r) { return inMonth(r.createdAt, key); });
    const foods = (state.foods || []).filter(function (f) { return f.done && inMonth(f.completedAt || f.createdAt, key); });
    const travels = (state.travels || []).filter(function (t) { return t.done && inMonth(t.completedAt || t.createdAt, key); });
    const dramas = (state.dramas || []).filter(function (d) { return d.status === 'done' && inMonth(d.completedAt || d.updatedAt || d.createdAt, key); });
    const memories = (state.memories || []).filter(function (m) { return inMonth(m.createdAt, key); });
    const visits = (state.visits || []).filter(function (v) { return String(v.date).slice(0, 7) === key; });
    const photos = [];
    statuses.forEach(function (p) {
      const imgs = Array.isArray(p.images) && p.images.length ? p.images : (p.image ? [p.image] : []);
      imgs.forEach(function (img) { photos.push({ src: img, post: p }); });
    });
    const moodCounts = {};
    statuses.forEach(function (p) { if (p.mood) moodCounts[p.mood] = (moodCounts[p.mood] || 0) + 1; });
    const topMood = Object.keys(moodCounts).sort(function (a, b) { return moodCounts[b] - moodCounts[a]; })[0] || '';
    return {
      statuses: statuses,
      reports: reports,
      foods: foods,
      travels: travels,
      dramas: dramas,
      memories: memories,
      visits: visits,
      photos: photos,
      topMood: topMood,
      lastStatus: statuses[0] || null
    };
  }

  function recapSentence(stats) {
    const bits = [];
    if (stats.statuses.length) bits.push('留下 ' + stats.statuses.length + ' 条动态');
    if (stats.reports.length) bits.push('报备 ' + stats.reports.length + ' 次');
    if (stats.foods.length) bits.push('打卡 ' + stats.foods.length + ' 个美食心愿');
    if (stats.travels.length) bits.push('完成 ' + stats.travels.length + ' 个旅行心愿');
    if (stats.dramas.length) bits.push('一起看完 ' + stats.dramas.length + ' 部剧');
    if (!bits.length) return '这个月安安静静的，但你们还在一起。';
    return '这个月，你们' + bits.join('、') + '。';
  }

  function cityPoint(city) {
    const raw = String(city || '').split('·')[0].trim();
    const key = Object.keys(CITY_COORDS).find(function (c) { return raw.indexOf(c) >= 0 || c.indexOf(raw) >= 0; });

    const c = CITY_COORDS[key];
    return {

      y: 22 + ((54 - c[1]) / (54 - 18)) * 216

  }

  /* =========================================================
     Countdowns + this day in history
     ========================================================= */
  function countdownTarget(cd) {
    const d = parseDate(cd.date);
    if (!d) return null;
    const time = /^\d{1,2}:\d{2}$/.test(cd.time || '') ? cd.time : '00:00';
    const parts = time.split(':');
    const hh = Number(parts[0]) || 0;
    const mm = Number(parts[1]) || 0;
    const now = new Date();
    if (cd.repeat === 'yearly') {
      let target = new Date(now.getFullYear(), d.getMonth(), d.getDate(), hh, mm, 0, 0);
      if (target.getMonth() !== d.getMonth()) target = new Date(now.getFullYear(), d.getMonth() + 1, 0, hh, mm, 0, 0);
      if (target.getTime() < now.getTime()) {
        target = new Date(now.getFullYear() + 1, d.getMonth(), d.getDate(), hh, mm, 0, 0);
        if (target.getMonth() !== d.getMonth()) target = new Date(now.getFullYear() + 1, d.getMonth() + 1, 0, hh, mm, 0, 0);
      }
      return target;
    }
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm, 0, 0);
  }

  function countdownInfo(cd) {
    const target = countdownTarget(cd);
    if (!target) return null;
    const diff = target.getTime() - Date.now();
    const abs = Math.abs(diff);
    return {
      target: target,
      diff: diff,
      past: diff < 0,
      days: Math.floor(abs / 86400000),
      hours: Math.floor((abs % 86400000) / 3600000),
      mins: Math.floor((abs % 3600000) / 60000),
      secs: Math.floor((abs % 60000) / 1000)
    };
  }

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  function countdownHms(info) {
    return pad2(info.hours) + ':' + pad2(info.mins) + ':' + pad2(info.secs);
  }

  function countdownDateLabel(cd) {
    const d = parseDate(cd.date);
    if (!d) return '日期待补';
    const time = cd.time && cd.time !== '00:00' ? ' ' + cd.time : '';
    if (cd.repeat === 'yearly') return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日' + time + ' · 每年';
    return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日' + time;
  }

  function renderCountdownCard(cd) {
    const info = countdownInfo(cd);
    if (!info) return '';
    const label = info.past ? '已经过去' : '还有';
    return '<article class="cd-card" data-cd-target="' + info.target.getTime() + '">' +
      '<div class="cd-card-head"><span class="cd-emoji">' + esc(cd.emoji || '💗') + '</span><div class="cd-card-title"><b>' + esc(cd.title) + '</b><small>' + esc(countdownDateLabel(cd)) + '</small></div>' +

      (cd.note ? '<p class="cd-note">' + esc(cd.note) + '</p>' : '') +
      '</article>';
  }

  function renderCountdownPage() {
    const list = (state.countdowns || []).slice().sort(function (a, b) {
      const ia = countdownInfo(a), ib = countdownInfo(b);
      if (!ia) return 1;
      if (!ib) return -1;
      if (ia.past !== ib.past) return ia.past ? 1 : -1;
      return ia.diff - ib.diff;
    });
    const next = list.find(function (c) { const i = countdownInfo(c); return i && !i.past; }) || list[0];
    const nextInfo = next ? countdownInfo(next) : null;
    const history = historyOnThisDay();
    return subhead('倒计时', 'us', '<button class="icon-btn" data-action="open-countdown-add" aria-label="添加倒计时">' + icon('plus', 16) + '</button>') +
      (next ? '<div class="cd-hero"><span class="eyebrow">NEXT SPECIAL DAY</span><div class="cd-hero-title"><span>' + esc(next.emoji || '💗') + '</span><h2>' + esc(next.title) + '</h2></div>' +

      (list.length ? '<div class="cd-list">' + list.map(renderCountdownCard).join('') + '</div>' : '<div class="empty"><span class="emoji">⏳</span><h3>还没有倒计时</h3><p>把生日、纪念日、下一次见面，或者随便一个想一起等到的日子写进来。</p><button class="btn btn-primary btn-sm" style="margin-top:10px" data-action="open-countdown-add">添加第一个</button></div>') +

      (history.length ? renderHistory(history) : '<div class="history-empty"><span>📜</span><p>还没有往年今天。<br>明年这个时候，今天写下的东西会回来找你。</p></div>') +
      '<div class="report-note">倒计时会每秒更新；「历史上的今天」会从动态、报备、清单、美食、旅行和足迹里，找出往年同一天发生的事。</div>';
  }

  function historyOnThisDay() {
    const now = new Date();
    const month = now.getMonth();
    const day = now.getDate();
    const currentYear = now.getFullYear();
    const items = [];
    function push(dateValue, type, text, emoji) {
      if (!dateValue) return;
      let d = null;
      if (dateValue instanceof Date) d = dateValue;
      else if (typeof dateValue === 'number') d = new Date(dateValue);
      else d = parseDate(String(dateValue));
      if (!d || d.getFullYear() >= currentYear) return;
      if (d.getMonth() !== month || d.getDate() !== day) return;
      const clean = String(text || '').replace(/\s+/g, ' ').trim();
      if (!clean) return;
      items.push({ year: d.getFullYear(), type: type, text: clean, emoji: emoji || '•' });
    }
    state.statuses.forEach(function (p) { push(p.createdAt, '动态', user(p.author).name + '：' + p.text, '💬'); });
    state.reports.forEach(function (r) { push(r.createdAt, '报备', user(r.author).name + '：' + (r.text || r.label || '报备'), r.emoji || '📣'); });
    state.memories.forEach(function (m) { push(m.createdAt, '回忆', '存下了「' + m.title + '」', '🎞️'); });
    state.foods.forEach(function (f) { if (f.done) push(f.completedAt || f.createdAt, '美食', '打卡了「' + f.title + '」', '🍜'); });
    state.travels.forEach(function (t) { if (t.done) push(t.completedAt || t.createdAt, '旅行', '完成了「' + t.title + '」', '🧳'); });
    state.visits.forEach(function (v) { push(v.date, '足迹', '去了' + v.city, '📍'); });
    state.events.forEach(function (e) { push(e.date, '约定', e.title, '🗓️'); });
    state.todos.forEach(function (t) { if (t.done) push(t.completedAt || t.createdAt, '清单', '完成了「' + t.title + '」', '✅'); });
    items.sort(function (a, b) { return b.year - a.year; });
    const seen = new Set();
    return items.filter(function (x) {
      const key = x.year + '|' + x.type + '|' + x.text;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).slice(0, 12);
  }

  function renderHistory(items) {
    const years = Array.from(new Set(items.map(function (x) { return x.year; }))).sort(function (a, b) { return b - a; });
    return '<div class="history-list">' + years.map(function (y) {
      return '<div class="history-year"><div class="history-year-label">' + y + '</div><div class="history-year-items">' +
        items.filter(function (x) { return x.year === y; }).map(function (x) {
          return '<div class="history-item"><span>' + esc(x.emoji) + '</span><div><b>' + esc(x.type) + '</b><p>' + esc(x.text) + '</p></div></div>';
        }).join('') + '</div></div>';
    }).join('') + '</div>';
  }

  function tickCountdowns() {
    if (!session.unlocked || session.page !== 'countdown') return;
    document.querySelectorAll('[data-cd-target]').forEach(function (el) {
      const target = Number(el.dataset.cdTarget);
      if (!target) return;
      const diff = target - Date.now();
      const abs = Math.abs(diff);
      const days = Math.floor(abs / 86400000);
      const hours = Math.floor((abs % 86400000) / 3600000);
      const mins = Math.floor((abs % 3600000) / 60000);
      const secs = Math.floor((abs % 60000) / 1000);
      const d = el.querySelector('.cd-days');
      const h = el.querySelector('.cd-hms');
      const label = el.querySelector('.cd-label');
      if (d) d.textContent = days;
      if (h) h.textContent = pad2(hours) + ':' + pad2(mins) + ':' + pad2(secs);
      if (label) label.textContent = diff < 0 ? '已经过去' : '还有';
    });
    const hero = document.querySelector('.cd-hero');
    if (hero) {
      const first = document.querySelector('[data-cd-target]');
      if (first) {
        const target = Number(first.dataset.cdTarget);
        const diff = target - Date.now();
        const abs = Math.abs(diff);
        const hd = hero.querySelector('[data-hero-days]');
        const hh = hero.querySelector('[data-hero-hms]');
        if (hd) hd.textContent = Math.floor(abs / 86400000);
        if (hh) hh.textContent = pad2(Math.floor((abs % 86400000) / 3600000)) + ':' + pad2(Math.floor((abs % 3600000) / 60000)) + ':' + pad2(Math.floor((abs % 60000) / 1000));
      }
    }
  }

    const layer = $modal.querySelector('.modal-layer');

    setTimeout(function () {
      const focusable = $modal.querySelector('.sheet input:not([type="hidden"]),.sheet textarea,.sheet select');
      if (focusable && window.innerWidth > 640) {
        try { focusable.focus({ preventScroll: true }); } catch (e) { }
      }
    }, 120);
  }

  function closeSheet(immediate) {
    const layer = $modal.querySelector('.modal-layer');
    if (!layer) {
      session.sheetOpen = false;
      document.body.classList.remove('modal-open');
      return;
    }
    layer.classList.remove('open');
    document.body.classList.remove('modal-open');
    session.sheetOpen = false;
    session.tempImage = '';
    session.tempImages = [];
    session.confirm = null;
    const remove = function () {
      if (layer.parentNode) layer.parentNode.removeChild(layer);
    };
    if (immediate) remove();
    else setTimeout(remove, 330);
    if (session.lastFocus && session.lastFocus.isConnected) {
      try { session.lastFocus.focus({ preventScroll: true }); } catch (e) { }
    }
    session.lastFocus = null;
  }

  function openMusicSheet() {
    const tracks = state.musicTracks || [];
    const current = state.meta.currentMusicId || 'builtin';
    const playing = !!session.musicPlaying;
    function row(id, title, sub, deletable) {
      const active = current === id;
      return '<div class="music-track' + (active ? ' active' : '') + '">' +
        '<span class="mt-icon">' + icon(active && playing ? 'pause' : 'play', 12) + '</span>' +
        '<span class="mt-copy"><b>' + esc(title) + '</b><span>' + esc(sub) + (active ? ' · 当前' : '') + '</span></span>' +
        '<button data-action="music-select" data-id="' + id + '" aria-label="' + (active && playing ? '暂停' : '播放') + '">' + icon(active && playing ? 'pause' : 'play', 11) + '</button>' +
        (deletable ? '<button class="mt-delete" data-action="delete-music" data-id="' + id + '" aria-label="删除这首">' + icon('trash', 11) + '</button>' : '') +
        '</div>';
    }
    showSheet(sheetHead('小屋音乐盒', '内置一段原创旋律；也可以把你自己下载的 MP3 导进来。音乐只留在这台设备。') +
      '<div class="music-track-list">' +
      row('builtin', '小屋旋律', '原创音乐盒 · 无版权 · 无需网络', false) +
      tracks.map(function (t) {
        return row(t.id, t.title, (t.artist || '本地导入') + ' · ' + (t.size ? (t.size / 1024 / 1024).toFixed(1) + ' MB' : '本地文件'), true);
      }).join('') +
      '</div>' +
      '<label class="upload-box"><span class="up-icon">' + icon('music', 16) + '</span><span class="up-copy"><b>导入本地音乐</b><span>MP3 / M4A / WAV / OGG，可多选</span></span><input type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg" multiple data-music-input></label>' +
      '<p class="report-note" style="margin-top:9px">音乐文件存在浏览器 IndexedDB 里，不会上传。<br>单个建议不超过 30MB；清理浏览器数据会一起丢掉，原文件请自己留好。</p>');
  }

  function openPasswordSheet() {
    showSheet(sheetHead('修改小屋密码', '密码只保存在这台设备，用来挡住随手翻开的人。') +
      '<form class="sheet-form" data-form="change-password">' +
      '<label class="field"><span>当前密码</span><input type="password" name="current" maxlength="64" autocomplete="current-password" required></label>' +
      '<label class="field"><span>新密码（至少 4 位）</span><input type="password" name="next" minlength="4" maxlength="32" autocomplete="new-password" required></label>' +
      '<label class="field"><span>再输一次新密码</span><input type="password" name="confirm" minlength="4" maxlength="32" autocomplete="new-password" required></label>' +
      '<label class="field"><span>密码提示（选填）</span><input type="text" name="hint" maxlength="40" value="' + esc(state.meta.hint || '') + '" placeholder="忘了可以看一眼的小提示"></label>' +
      '<div class="form-error" data-error></div>' +
      '<div class="sheet-foot"><button class="btn btn-ghost" type="button" data-action="close-sheet">取消</button><button class="btn btn-primary" type="submit">' + icon('key', 13) + ' 换一把锁</button></div>' +
      '</form>');
  }

  function openConfirm(title, message, confirmLabel, onConfirm, danger) {
    session.confirm = onConfirm;
    showSheet('<div class="confirm-body"><div class="confirm-emoji">' + (danger ? '🥺' : '🎀') + '</div><h2>' + esc(title) + '</h2>' +
      '<p>' + esc(message).replace(/\n/g, '<br>') + '</p></div>' +
      '<div class="confirm-actions"><button class="btn btn-secondary" type="button" data-action="close-sheet">再想想</button>' +
      '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" type="button" data-action="run-confirm">' + esc(confirmLabel) + '</button></div>');

  /* =========================================================
     Actions
     ========================================================= */
  function handleAction(action, el, event) {
    const id = el.dataset.id;
    switch (action) {
      case 'nav':
        navigate(el.dataset.page);
        break;
      case 'lock':
        lockApp();
        break;
      case 'setup-back': {
        const form = document.querySelector('form[data-form="setup-profile"]');
        if (form) {
          const fd = new FormData(form);
          session.setup.aName = String(fd.get('aName') || session.setup.aName);
          session.setup.bName = String(fd.get('bName') || session.setup.bName);
          session.setup.aBirth = String(fd.get('aBirth') || '');
          session.setup.bBirth = String(fd.get('bBirth') || '');
          session.setup.aAvatar = String(fd.get('aAvatar') || 'mochi');
          session.setup.bAvatar = String(fd.get('bAvatar') || 'bunny');
          session.setup.start = String(fd.get('start') || '');
        }
        renderSetup(1);
        window.scrollTo(0, 0);
        break;
      }
      case 'toggle-password': {
        const wrap = el.closest('.password-wrap');
        if (!wrap) break;
        const input = wrap.querySelector('input');
        if (!input) break;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        el.innerHTML = icon(show ? 'eyeOff' : 'eye', 16);
        el.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
        break;
      }
      case 'show-hint': {
        const box = document.querySelector('[data-hint]');
        const resetBox = document.querySelector('[data-reset-box]');
        if (!box && !resetBox) {
          toast('没有设置密码提示，试试你们常用的暗号', '🥺');
          break;
        }
        if (box) box.classList.toggle('hidden');
        if (resetBox) resetBox.classList.toggle('hidden');
        const open = (box && !box.classList.contains('hidden')) || (resetBox && !resetBox.classList.contains('hidden'));
        el.textContent = open ? '收起提示' : '忘记暗号？';
        break;
      }
      case 'switch-user':
        openSwitchUserSheet();
        break;
      case 'set-user': {
        const next = el.dataset.user === 'b' ? 'b' : 'a';
        session.activeUser = next;
        state.meta.activeUser = next;
        saveState();
        closeSheet(true);
        renderTopbar();
        refreshPage(true);
        toast('现在是 ' + user(next).name + ' 在小屋', '🎀');
        break;
      }
      case 'open-status':
        openStatusSheet(el.dataset.user);
        break;
      case 'open-report':
        openReportSheet();
        break;
      case 'quick-report':
        addQuickReport(el.dataset.type, el);
        break;
      case 'report-filter':
        session.reportFilter = el.dataset.filter || 'all';
        refreshPage(true);
        break;
      case 'feed-filter':
        session.feedFilter = el.dataset.filter || 'all';
        refreshPage(true);
        break;
      case 'toggle-feed':
        session.showAllFeed = !session.showAllFeed;
        refreshPage(true);
        break;
      case 'react':
        toggleReaction(el.dataset.post, el.dataset.emoji, el);
        break;
      case 'toggle-comments': {
        const pid = el.dataset.post;
        if (session.openComments.has(pid)) session.openComments.delete(pid);
        else session.openComments.add(pid);
        session.stickerFor = null;
        refreshPage(true);
        break;
      }
      case 'toggle-stickers': {
        const pid = el.dataset.post;
        session.stickerFor = session.stickerFor === pid ? null : pid;
        session.openComments.add(pid);
        refreshPage(true);
        break;
      }
      case 'add-sticker':
        addSticker(el.dataset.post, Number(el.dataset.index));
        break;
      case 'delete-post':
        askDeletePost(id);
        break;
      case 'delete-comment':
        deleteComment(el.dataset.post, id);
        break;
      case 'open-food-add':
        openFoodSheet(el.dataset.type || session.foodType);
        break;
      case 'food-tab':
        session.foodType = el.dataset.type === 'dish' ? 'dish' : 'restaurant';
        refreshPage(true);
        break;
      case 'toggle-food':
        toggleFood(id, el);
        break;
      case 'edit-food':
        openFoodSheet(null, id);
        break;
      case 'random-food':
        randomFood();
        break;
      case 'open-travel-add':
        openTravelSheet(el.dataset.type || session.travelType);
        break;
      case 'travel-tab':
        session.travelType = ['place', 'todo', 'shop'].indexOf(el.dataset.type) >= 0 ? el.dataset.type : 'place';
        refreshPage(true);
        break;
      case 'toggle-travel':
        toggleTravel(id, el);
        break;
      case 'edit-travel':
        openTravelSheet(null, id);
        break;
      case 'open-drama-add':
        openDramaSheet();
        break;
      case 'drama-filter':
        session.dramaFilter = el.dataset.filter || 'all';
        refreshPage(true);
        break;
      case 'drama-done':
        toggleDramaDone(id);
        break;
      case 'edit-drama':
        openDramaSheet(id);
        break;
      case 'add-rec':
        addRecommendation(el.dataset.title);
        break;
      case 'calendar-shift':
        session.calendarMonth = monthShift(session.calendarMonth, Number(el.dataset.delta) || 1);
        refreshPage(true);
        break;
      case 'open-event-add':
        openEventSheet(el.dataset.date);
        break;
      case 'edit-event':
        openEventSheet(null, id);
        break;
      case 'delete-event':
        askDeleteNew('event', id);
        break;
      case 'todo-filter':
        session.checklistFilter = el.dataset.filter || 'all';
        refreshPage(true);
        break;
      case 'open-todo-add':
        openTodoSheet();
        break;
      case 'toggle-todo':
        toggleTodo(id);
        break;
      case 'edit-todo':
        openTodoSheet(id);
        break;
      case 'delete-todo':
        askDeleteNew('todo', id);
        break;
      case 'recap-shift':
        session.recapMonth = monthShift(session.recapMonth, Number(el.dataset.delta) || 1);
        refreshPage(true);
        break;
      case 'print-recap':
        printRecap();
        break;
      case 'copy-recap':
        copyRecapText();
        break;
      case 'open-countdown-add':
        openCountdownSheet();
        break;
      case 'edit-countdown':
        openCountdownSheet(id);
        break;
      case 'delete-countdown':
        askDeleteNew('countdown', id);
        break;
      case 'countdown-preset':
        applyCountdownPreset(el);
        break;
      case 'open-footprint-add':
        openFootprintSheet();
        break;
      case 'edit-footprint':
        openFootprintSheet(id);
        break;
      case 'delete-visit':
        askDeleteNew('visit', id);
        break;
      case 'open-memory-add':
        openMemorySheet();
        break;
      case 'memory-filter':
        session.memoryFilter = el.dataset.filter || 'all';
        refreshPage(true);
        break;
      case 'edit-memory':
        openMemorySheet(id);
        break;
      case 'copy-link':
        copyLink(el.dataset.url);
        break;
      case 'open-link':
        openExternal(el.dataset.url);
        break;
      case 'generate-ai':
        startAiGeneration();
        break;
      case 'edit-profiles':
        openProfileSheet();
        break;
      case 'change-password':
        openPasswordSheet();
        break;
      case 'export-data':
        exportData();
        break;
      case 'import-data':
        importData();
        break;
      case 'clear-samples':
        askClearSamples();
        break;
      case 'reset-house':
        askResetHouse();
        break;
      case 'reset-from-lock':
        askResetHouse();
        break;
      case 'close-sheet':
        closeSheet();
        break;
      case 'run-confirm': {
        const cb = session.confirm;
        session.confirm = null;
        closeSheet(true);
        if (cb) setTimeout(cb, 60);
        break;
      }
      case 'sheet-type': {
        const form = el.closest('form');
        const field = el.dataset.field;
        const value = el.dataset.value;
        if (!form || !field) break;
        const hidden = form.querySelector('input[name="' + field + '"]');
        if (hidden) hidden.value = value;
        const group = el.closest('.type-switch');
        if (group) {
          Array.from(group.querySelectorAll('button')).forEach(function (b) {
            b.classList.toggle('active', b === el);
          });
        }
        break;
      }
      case 'remove-image': {
        session.tempImage = '';
        const field = el.closest('[data-image-field]');
        setImageField(field, '');
        break;
      }
      case 'remove-status-image': {
        const index = Number(el.dataset.index);
        if (Number.isInteger(index)) session.tempImages.splice(index, 1);
        updateImagesPreview(el.closest('[data-images-field]'));
        break;
      }
      case 'delete-food':
        askDelete('food', id);
        break;
      case 'delete-travel':
        askDelete('travel', id);
        break;
      case 'delete-drama':
        askDelete('drama', id);
        break;
      case 'delete-memory':
        askDelete('memory', id);
        break;
      default:
        break;
    }
  }

  function addQuickReport(type, el) {
    const def = REPORT_TYPES.find(function (r) { return r.type === type; }) || { type: type || '报备', emoji: '💌', text: '' };
    const report = {
      id: uid('r'),
      author: session.activeUser,
      type: def.type,
      emoji: def.emoji,
      text: def.text || def.type,
      createdAt: Date.now()
    };
    state.reports.push(report);
    saveState();
    if (el) {
      const r = el.getBoundingClientRect();
      heartBurst(r.left + r.width / 2, r.top + r.height / 2, def.emoji, 5);
      haptic(10);
    }
    refreshPage(true);
    toast('已报备 · ' + def.type, def.emoji);
  }

  function toggleReaction(postId, emoji, el) {
    const p = state.statuses.find(function (x) { return x.id === postId; });
    if (!p) return;
    p.reactions = p.reactions || {};
    const arr = p.reactions[emoji] || [];
    const idx = arr.indexOf(session.activeUser);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(session.activeUser);
    p.reactions[emoji] = arr;
    saveState();
    if (idx < 0 && el) {
      const r = el.getBoundingClientRect();
      heartBurst(r.left + r.width / 2, r.top + r.height / 2, emoji, 4);
      haptic(8);
    }
    refreshPage(true);
  }

  function addSticker(postId, index) {
    const p = state.statuses.find(function (x) { return x.id === postId; });
    const sticker = STICKERS[index];
    if (!p || !sticker) return;
    p.comments = p.comments || [];
    p.comments.push({ id: uid('c'), author: session.activeUser, sticker: { emoji: sticker.emoji, label: sticker.label }, createdAt: Date.now() });
    session.stickerFor = null;
    saveState();
    refreshPage(true);
    toast('贴了一张「' + sticker.label + '」', sticker.emoji);
  }

  function deleteComment(postId, commentId) {
    const p = state.statuses.find(function (x) { return x.id === postId; });
    if (!p) return;
    p.comments = (p.comments || []).filter(function (c) { return c.id !== commentId; });
    saveState();
    refreshPage(true);
    toast('评论删掉了', '🫧');
  }

  function askDeletePost(id) {
    openConfirm('删掉这条动态？', '这条动态下面的评论和表情也会一起消失。', '删掉', function () {
      state.statuses = state.statuses.filter(function (p) { return p.id !== id; });
      saveState();
      closeSheet(true);
      refreshPage(true);
      toast('删掉了，回忆还长', '🫧');
    }, true);
  }

  function toggleFood(id, el) {
    const f = state.foods.find(function (x) { return x.id === id; });
    if (!f) return;
    f.done = !f.done;
    if (f.done) f.completedAt = Date.now();
    else delete f.completedAt;
    saveState();
    if (f.done) {
      if (el) {
        const r = el.getBoundingClientRect();
        heartBurst(r.left + r.width / 2, r.top + r.height / 2, '🍰', 5);
      }
      confetti();
      toast('打卡成功 · ' + f.title, '🍰');
    } else {
      toast('已移回心愿清单', '🍜');
    }
    refreshPage(true);
  }

  function toggleTravel(id, el) {
    const t = state.travels.find(function (x) { return x.id === id; });
    if (!t) return;
    t.done = !t.done;
    if (t.done) t.completedAt = Date.now();
    else delete t.completedAt;
    saveState();
    if (t.done) {
      if (el) {
        const r = el.getBoundingClientRect();
        heartBurst(r.left + r.width / 2, r.top + r.height / 2, '✨', 5);
      }
      confetti();
      toast('心愿打勾啦 · ' + t.title, '✨');
    } else {
      toast('已移回旅行手帐', '📍');
    }
    refreshPage(true);
  }

  function toggleDramaDone(id) {
    const d = state.dramas.find(function (x) { return x.id === id; });
    if (!d) return;
    const wasDone = d.status === 'done';
    d.status = wasDone ? 'want' : 'done';
    if (wasDone) delete d.completedAt;
    else d.completedAt = Date.now();
    d.updatedAt = Date.now();
    saveState();
    if (!wasDone) {
      confetti();
      toast('又一起看完一部剧，记得聊聊最喜欢的那一段', '🎬');
    } else {
      toast('已移回想看清单', '📺');
    }
    refreshPage(true);
  }

  function addRecommendation(title) {
    const rec = DRAMA_RECS.find(function (r) { return r.title === title; });
    if (!rec) return;
    if (state.dramas.some(function (d) { return d.title === rec.title; })) {
      toast('这部剧已经在清单里啦', '📺');
      return;
    }
    state.dramas.push({
      id: uid('d'),
      title: rec.title,
      platform: rec.platform,
      total: rec.total,
      status: 'want',
      note: rec.note,
      emoji: rec.emoji,
      link: '',
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
    saveState();
    if (session.page !== 'dramas') navigate('dramas');
    else refreshPage(true);
    toast('《' + rec.title + '》已加入剧场', '📺');
  }

  function toggleTodo(id) {
    const t = state.todos.find(function (x) { return x.id === id; });
    if (!t) return;
    t.done = !t.done;
    if (t.done) t.completedAt = Date.now();
    else delete t.completedAt;
    saveState();
    const allDone = state.todos.length && state.todos.every(function (x) { return x.done; });
    if (t.done && allDone) {
      confetti();
      toast('清单全部打勾啦，今天很了不起', '✅');
    } else if (t.done) {
      toast('又完成一件小事', '✅');
    } else {
      toast('已移回未完成', '📝');
    }
    refreshPage(true);
  }

  function copyRecapText() {
    const text = recapPlainText(session.recapMonth);
    const done = function () { toast('本月小结已复制', '📋'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  function applyCountdownPreset(el) {
    const form = el.closest('form');
    if (!form) return;
    const title = form.querySelector('[name="title"]');
    const date = form.querySelector('[name="date"]');
    const emoji = form.querySelector('[name="emoji"]');
    const md = el.dataset.md || '02-14';
    const year = el.dataset.year || String(new Date().getFullYear());
    if (title) title.value = el.dataset.title || '';
    if (date) date.value = year + '-' + md;
    if (emoji) emoji.value = el.dataset.emoji || '💗';
  }

  function askDeleteNew(kind, id) {
    const names = { event: '日程', todo: '清单', visit: '足迹', countdown: '倒计时' };
    openConfirm('删掉这个' + (names[kind] || '内容') + '？', '删除后不能恢复。', '删掉', function () {
      if (kind === 'event') state.events = state.events.filter(function (x) { return x.id !== id; });
      if (kind === 'todo') state.todos = state.todos.filter(function (x) { return x.id !== id; });
      if (kind === 'visit') state.visits = state.visits.filter(function (x) { return x.id !== id; });
      if (kind === 'countdown') state.countdowns = state.countdowns.filter(function (x) { return x.id !== id; });
      saveState();
      closeSheet(true);
      refreshPage(true);
      toast('删掉了', '🫧');
    }, true);
  }

  function startAiGeneration() {
    if (session.aiLoading) return;
    session.aiLoading = true;

  /* =========================================================
     Image handling
     ========================================================= */
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) {
        reject(new Error('not an image'));
        return;
      }
      const reader = new FileReader();
      reader.onerror = function () { reject(new Error('read failed')); };
      reader.onload = function () {
        const img = new Image();
        img.onerror = function () { reject(new Error('decode failed')); };
        img.onload = function () {
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          if (!w || !h) { reject(new Error('empty image')); return; }
          const scale = Math.min(1, MAX_IMAGE_EDGE / Math.max(w, h));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(w * scale));
          canvas.height = Math.max(1, Math.round(h * scale));
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fffaf5';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          let quality = 0.78;
          let data = canvas.toDataURL('image/jpeg', quality);
          while (data.length > 440000 && quality > 0.5) {
            quality -= 0.06;
            data = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(data);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
